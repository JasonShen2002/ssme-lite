name: Test and document
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,docs]' build twine
      - run: python -m pytest -q
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed distribution outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib -q
          python "$GITHUB_WORKSPACE/examples/quickstart.py"
          python "$GITHUB_WORKSPACE/examples/sklearn_models.py"
          ssme-lite results/quickstart/evaluation.json
          ssme-lite --help
